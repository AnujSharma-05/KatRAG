version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: jpl-postgres
    restart: always
    environment:
      POSTGRES_USER: task0_user
      POSTGRES_PASSWORD: task0_password
      POSTGRES_DB: JPL_task0_RapidFoundation
    ports:
      - "5432:5432"
      # 5. Go API Gateway
  api-gateway:
    build:
      context: ../../live/backend
    container_name: katrag-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKER_URL=redpanda:9092
      - MINIO_ENDPOINT=minio:9000
      - DATABASE_URL=postgres://task0_user:task0_password@db:5432/JPL_task0_RapidFoundation?sslmode=disable
    depends_on:
      - redpanda
      - minio
      - db

volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Application Service
  web:
    build:
      context: ..
      dockerfile: Docker/dockerfile
    container_name: jpl-rag-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://task0_user:task0_password@db:5432/JPL_task0_RapidFoundation
      - MILVUS_URI=http://host.docker.internal:19530
      - GEMINI_API_KEY=[GCP_API_KEY]
      - MILVUS_COLLECTION=document_chunks
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_DIM=384
    extra_hosts:
      # Allows the container to access Milvus running on your host machine
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  # 3. Redpanda (Kafka API compatible broker)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: katrag-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9092:9092"
      # 5. Go API Gateway
  api-gateway:
    build:
      context: ../../live/backend
    container_name: katrag-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKER_URL=redpanda:9092
      - MINIO_ENDPOINT=minio:9000
      - DATABASE_URL=postgres://task0_user:task0_password@db:5432/JPL_task0_RapidFoundation?sslmode=disable
    depends_on:
      - redpanda
      - minio
      - db

volumes:
      - redpanda_data:/var/lib/redpanda/data

  # 4. MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: katrag-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server /data --console-address ":9001"
      # 5. Go API Gateway
  api-gateway:
    build:
      context: ../../live/backend
    container_name: katrag-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKER_URL=redpanda:9092
      - MINIO_ENDPOINT=minio:9000
      - DATABASE_URL=postgres://task0_user:task0_password@db:5432/JPL_task0_RapidFoundation?sslmode=disable
    depends_on:
      - redpanda
      - minio
      - db

volumes:
      - minio_data:/data

  # 5. Go API Gateway
  api-gateway:
    build:
      context: ../../live/backend
    container_name: katrag-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKER_URL=redpanda:9092
      - MINIO_ENDPOINT=minio:9000
      - DATABASE_URL=postgres://task0_user:task0_password@db:5432/JPL_task0_RapidFoundation?sslmode=disable
    depends_on:
      - redpanda
      - minio
      - db

volumes:
  postgres_data:
  redpanda_data:
  minio_data:


