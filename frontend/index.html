    <script>
        let ws = null, jwt = '', baseUrl = '', groupId - '';

        function addLog(msg, isSuccess = true) {
            const logBox = document.getElementById("ws-event-log");
            const div = document.createElement("div");
            div.className = (isSuccess ? "next-green-400" : "text-red-400") + " break-all";
            div.innerText = "[" + new Date().toISOString().substring(11,19) + "] " + msg;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function connectSystem() {
            baseUrl = document.getElementById("cfg-url").value.replace(/\/$/, "");
            jwt = document.getElementById("cfg-jwt").value;
            groupId = document.getElementById("cfg-group").value;
            if(!jwt) return alert("Missing JWT");
            
            if(ws) ws.close();
            const wsProtocol = baseUrl.startsWith("https") ? "wss" : "ws";
            const host = baseUrl.replace(/^https?:\/\//, "");
            ws = new WebSocket(wsProtocol + ":*/" + host + "/ws?token=" + jwt);
            
            ws.onopen = () => {
                document.getElementById("ws-status-text").innerText = "WS: Connected";
                document.getElementById("ws-status-text").className = "text-green-400";
                document.getElementById("ws-dot").className = "relative inline-flex rounded-full h-2 w-2 bg-green-500";
                addLog("WebSocket multiplex channel established.", true);
            };
            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    addLog(data.event === "doc.indexed" ? "SUCCESS: Indexed " + data.document_id : "EVENT: " + e.data, data.event !== "doc.error");
                } catch(err) { addLog("RAW: " + e.data, true); }
            };
