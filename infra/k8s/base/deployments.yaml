apiVersion: apps/v1
kind: Deployment
metadata:
  name: katrag-go-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: katrag-go-gateway
  template:
    metadata:
      labels:
        app: katrag-go-gateway
    spec:
      containers:
      - name: gateway
        image: katrag/go-gateway:v1
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katrag-core-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: katrag-core-api
  template:
    metadata:
      labels:
        app: katrag-core-api
    spec:
      containers:
      - name: core-api
        image: katrag/core-api:v1
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
