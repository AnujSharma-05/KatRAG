apiVersion: apps/v1
kind: Deployment
metadata:
  name: katrag-go-gateway
  labels:
    app: katrag-go-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: katrag-go-gateway
  template:
    metadata:
      labels:
        app: katrag-go-gateway
    spec:
      containers:
      - name: go-gateway
        image: katrag-go-gateway:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: katrag-config
        - secretRef:
            name: katrag-secrets

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katrag-core-api
  labels:
    app: katrag-core-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: katrag-core-api
  template:
    metadata:
      labels:
        app: katrag-core-api
    spec:
      containers:
      - name: core-api
        image: katrag-core-api:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        envFrom:
        - configMapRef:
            name: katrag-config
        - secretRef:
            name: katrag-secrets
